name: vNext runtime CI

on:
  pull_request:
    paths:
      - 'vnext/**'
      - 'status-lab/research/codex-stdio-bridge/**'
      - '.github/workflows/vnext-build.yml'
  push:
    branches:
      - 'agent/**'
    paths:
      - 'vnext/**'
      - 'status-lab/research/codex-stdio-bridge/**'
      - '.github/workflows/vnext-build.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Fetch exact PR base commit
        if: github.event_name == 'pull_request'
        shell: powershell
        run: git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: Restore vNext
        run: dotnet restore vnext/Vorotex.K15.Runtime.Tests/Vorotex.K15.Runtime.Tests.csproj
      - name: Restore vNext UI clients
        run: |
          dotnet restore vnext/Vorotex.K15.StatusTray/Vorotex.K15.StatusTray.csproj
          dotnet restore vnext/Vorotex.K15.ControlCenter/Vorotex.K15.ControlCenter.csproj
          dotnet restore vnext/Vorotex.K15.LiveDashboard/Vorotex.K15.LiveDashboard.csproj

      - name: Build vNext
        run: dotnet build vnext/Vorotex.K15.Runtime.Tests/Vorotex.K15.Runtime.Tests.csproj -c Release --no-restore

      - name: Run vNext tests
        run: dotnet run --project vnext/Vorotex.K15.Runtime.Tests/Vorotex.K15.Runtime.Tests.csproj -c Release --no-build

      - name: Dashboard #138 formatter regression
        run: node vnext/Vorotex.K15.LiveDashboard/tests/dashboard-formatter.test.cjs

      - name: Build vNext Status Tray
        run: dotnet build vnext/Vorotex.K15.StatusTray/Vorotex.K15.StatusTray.csproj -c Release --no-restore
      - name: Build vNext Control Center
        run: dotnet build vnext/Vorotex.K15.ControlCenter/Vorotex.K15.ControlCenter.csproj -c Release --no-restore
      - name: Build vNext Live Dashboard
        run: dotnet build vnext/Vorotex.K15.LiveDashboard/Vorotex.K15.LiveDashboard.csproj -c Release --no-restore
      - name: Publish vNext Status Tray win-x64
        run: dotnet publish vnext/Vorotex.K15.StatusTray/Vorotex.K15.StatusTray.csproj -c Release --no-restore
      - name: Publish vNext Control Center win-x64
        run: dotnet publish vnext/Vorotex.K15.ControlCenter/Vorotex.K15.ControlCenter.csproj -c Release --no-restore
      - name: Publish vNext Live Dashboard win-x64
        run: dotnet publish vnext/Vorotex.K15.LiveDashboard/Vorotex.K15.LiveDashboard.csproj -c Release --no-restore
      - name: Build deterministic side-by-side package
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File vnext/packaging/New-VNextPackage.ps1 -OutputDirectory "$env:RUNNER_TEMP\k15-vnext-package" -SourceCommit "${{ github.sha }}" -BaseMainSha "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}" -SourceRef "${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.head_ref) || github.ref }}"
      - name: Validate package manifest and update rollback contract
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File vnext/packaging/Test-VNextPackage.ps1 -PackageDirectory "$env:RUNNER_TEMP\k15-vnext-package"
      - name: Explicit diff check
        shell: powershell
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
        run: git diff --check "$env:BASE_SHA..$env:GITHUB_SHA"

      - name: Legacy device ownership and protocol smoke (non-HID)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File status-lab/tests/device-manager-smoke.ps1

      - name: Legacy K15 protocol/config regression (non-HID)
        run: dotnet run --project status-lab/tests/CanonicalNormalSmoke.csproj -c Release
  bridge-full-regression:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Full codex-stdio-bridge regression suite
        working-directory: status-lab/research/codex-stdio-bridge
        run: npm.cmd test

      - name: Explicit diff check
        shell: powershell
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
        run: git diff --check "$env:BASE_SHA..$env:GITHUB_SHA"
