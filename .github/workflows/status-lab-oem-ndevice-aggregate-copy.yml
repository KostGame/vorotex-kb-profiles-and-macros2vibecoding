name: Status Lab OEM Ndevice Aggregate Copy Trace

on:
  pull_request:
    paths:
      - 'status-lab/hid-research-lab/OemNdeviceAggregateCopy*.cs'
      - 'status-lab/tests/oem-ndevice-aggregate-copy-smoke.ps1'
      - '.github/workflows/status-lab-oem-ndevice-aggregate-copy.yml'
  push:
    branches:
      - 'agent/**'
    paths:
      - 'status-lab/hid-research-lab/OemNdeviceAggregateCopy*.cs'
      - 'status-lab/tests/oem-ndevice-aggregate-copy-smoke.ps1'
      - '.github/workflows/status-lab-oem-ndevice-aggregate-copy.yml'

permissions:
  contents: read

jobs:
  ndevice-aggregate-copy-readonly:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: OEM Ndevice Aggregate Copy read-only safety smoke
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File status-lab/tests/oem-ndevice-aggregate-copy-smoke.ps1

      - name: Restore HID Research Lab
        run: dotnet restore status-lab/hid-research-lab/Vorotex.K15.HidResearchLab.csproj

      - name: Build HID Research Lab
        run: dotnet build status-lab/hid-research-lab/Vorotex.K15.HidResearchLab.csproj -c Release --no-restore
