name: RC2 Codex attention implementation once

on:
  push:
    branches:
      - agent/k15-rc2-codex-unread-probe
    paths:
      - .github/workflows/rc2-codex-attention-implement-once.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: windows-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/k15-rc2-codex-unread-probe
          fetch-depth: 4

      - name: Verify staged ancestry
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git branch --show-current) -ne 'agent/k15-rc2-codex-unread-probe') { throw 'Unexpected branch.' }
          $base = git rev-parse 'HEAD^^^'
          if ($base -ne '235ed1fdff8e1e5fc801807d717b4ee5983ca86a') { throw "Unexpected implementation base: $base" }

      - name: Recover and apply staged implementation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $previous = (git show 'HEAD^^:.github/workflows/rc2-codex-attention-implement-once.yml') -join "`n"
          $startMarker = "          @'`n"
          $endMarker = "`n          '@ | python -"
          $start = $previous.IndexOf($startMarker, [StringComparison]::Ordinal)
          $end = $previous.IndexOf($endMarker, [StringComparison]::Ordinal)
          if ($start -lt 0 -or $end -le $start) { throw 'Could not recover staged implementation payload.' }
          $payloadStart = $start + $startMarker.Length
          $payload = $previous.Substring($payloadStart, $end - $payloadStart)
          $payload = [Text.RegularExpressions.Regex]::Replace($payload, '(?m)^          ', '')
          [IO.File]::WriteAllText((Join-Path $PWD '_rc2_apply.py'), $payload, [Text.UTF8Encoding]::new($false))

          $patcher = @'
          from pathlib import Path
          p = Path('_rc2_apply.py')
          text = p.read_text(encoding='utf-8')
          start = text.index('def replace_exact(path, old, new):')
          end = text.index('\n\n# State reducer:', start)
          replacement = '''import re
          import textwrap

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) == 1:
                  p.write_text(text.replace(old, new), encoding='utf-8')
                  return

              old_lines = textwrap.dedent(old).strip('\\n').splitlines()
              parts = []
              for line in old_lines:
                  stripped = line.strip()
                  if stripped:
                      parts.append(r'^[ \\t]*' + re.escape(stripped) + r'[ \\t]*$')
                  else:
                      parts.append(r'^[ \\t]*$')
              pattern = re.compile('\\n'.join(parts), re.MULTILINE)
              matches = list(pattern.finditer(text))
              if len(matches) != 1:
                  raise SystemExit(f'{path}: expected semantic fragment once, got {len(matches)}')

              match = matches[0]
              first_line = match.group(0).splitlines()[0]
              base_indent = re.match(r'^[ \\t]*', first_line).group(0)
              normalized_new = textwrap.dedent(new).strip('\\n')
              replacement_text = '\\n'.join(
                  (base_indent + line if line else '') for line in normalized_new.splitlines())
              p.write_text(text[:match.start()] + replacement_text + text[match.end():], encoding='utf-8')
          '''
          p.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          '@
          $patcher = [Text.RegularExpressions.Regex]::Replace($patcher, '(?m)^          ', '')
          $patcher | python -
          python _rc2_apply.py
          Remove-Item _rc2_apply.py -Force

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate implementation before commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -NoProfile -ExecutionPolicy Bypass -File status-lab/tests/rc2-smoke.ps1
          dotnet run --project status-lab/tests/StateReducerSmoke.csproj -c Release
          dotnet run --project status-lab/tests/CodexAttentionSmoke.csproj -c Release
          dotnet build status-lab/Vorotex.K15.StatusLab.csproj -c Release
          dotnet build status-lab/control-center/Vorotex.K15.ControlCenter.csproj -c Release

      - name: Commit implementation and remove one-shot workflow
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rm .github/workflows/rc2-codex-attention-implement-once.yml
          git config user.name KostGame
          git config user.email 22446683+KostGame@users.noreply.github.com
          git add status-lab .github/workflows/status-lab-build.yml
          $changed = @(git diff --cached --name-only)
          if ($changed -notcontains 'status-lab/CodexDesktopAttention.cs') { throw 'CodexDesktopAttention.cs missing from staged diff.' }
          if ($changed -notcontains 'status-lab/tests/CodexAttentionSmokeProgram.cs') { throw 'Codex attention smoke missing from staged diff.' }
          git commit -m 'feat(status-lab): add Codex desktop attention probe'
          git push origin HEAD:agent/k15-rc2-codex-unread-probe
