name: RC2 Codex attention implementation once

on:
  push:
    branches:
      - agent/k15-rc2-codex-unread-probe
    paths:
      - .github/workflows/rc2-codex-attention-implement-once.yml

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  BASE_SHA: 235ed1fdff8e1e5fc801807d717b4ee5983ca86a

jobs:
  implement:
    runs-on: windows-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/k15-rc2-codex-unread-probe
          fetch-depth: 0

      - name: Verify staging-only delta
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git merge-base --is-ancestor $env:BASE_SHA HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Approved RC2 head is not an ancestor.' }
          $unexpected = @(git diff --name-only "$env:BASE_SHA..HEAD" | Where-Object { $_ -ne '.github/workflows/rc2-codex-attention-implement-once.yml' })
          if ($unexpected.Count -gt 0) { throw ('Unexpected pre-implementation paths: ' + ($unexpected -join ', ')) }

      - name: Materialize and transform exact RC2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Write-GitBlob([string]$Sha, [string]$Path) {
            $json = gh api "/repos/$env:GITHUB_REPOSITORY/git/blobs/$Sha" | ConvertFrom-Json
            $bytes = [Convert]::FromBase64String(($json.content -replace '\s', ''))
            $parent = Split-Path -Parent $Path
            if ($parent) { New-Item -ItemType Directory -Force -Path $parent | Out-Null }
            [IO.File]::WriteAllBytes($Path, $bytes)
          }

          Write-GitBlob 'c89205367195cfd630f45596db6ec65af082478e' 'status-lab/CodexDesktopAttention.cs'
          Write-GitBlob '678c551b69ca910a5dbfe98d2d97bbc1f62d3ca4' 'status-lab/tests/CodexAttentionSmoke.csproj'
          Write-GitBlob 'b5e1a969616426225b1be7c9fea552f84179b916' 'status-lab/tests/CodexAttentionSmokeProgram.cs'
          Write-GitBlob '1424c20293ba126cc155c454f22e28b45ce49def' '_codex_attention_transform.py'
          python _codex_attention_transform.py
          if ($LASTEXITCODE -ne 0) { throw 'Deterministic source transform failed.' }
          Remove-Item _codex_attention_transform.py -Force

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate implementation before commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -NoProfile -ExecutionPolicy Bypass -File status-lab/tests/rc2-smoke.ps1
          dotnet run --project status-lab/tests/StateReducerSmoke.csproj -c Release
          dotnet run --project status-lab/tests/CodexAttentionSmoke.csproj -c Release
          dotnet build status-lab/Vorotex.K15.StatusLab.csproj -c Release
          dotnet build status-lab/control-center/Vorotex.K15.ControlCenter.csproj -c Release

      - name: Commit implementation and remove one-shot workflow
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rm .github/workflows/rc2-codex-attention-implement-once.yml
          git config user.name KostGame
          git config user.email 22446683+KostGame@users.noreply.github.com
          git add status-lab .github/workflows/status-lab-build.yml

          $expected = @(
            '.github/workflows/status-lab-build.yml',
            'status-lab/CodexDesktopAttention.cs',
            'status-lab/EventJournal.cs',
            'status-lab/JournalStateNormalizer.cs',
            'status-lab/StateReducer.cs',
            'status-lab/StatusTrayApplicationContext.cs',
            'status-lab/control-center/ControlCenterForm.cs',
            'status-lab/shared/StatusTrayIpc.cs',
            'status-lab/tests/CodexAttentionSmoke.csproj',
            'status-lab/tests/CodexAttentionSmokeProgram.cs'
          ) | Sort-Object
          $actual = @(git diff --cached --name-only $env:BASE_SHA) | Sort-Object
          if (Compare-Object $expected $actual) { throw ('Unexpected staged scope: ' + ($actual -join ', ')) }

          git commit -m 'feat(status-lab): add Codex desktop attention probe'
          git push origin HEAD:agent/k15-rc2-codex-unread-probe
