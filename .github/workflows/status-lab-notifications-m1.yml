name: Status Lab Notification Engine

on:
  pull_request:
    paths:
      - 'status-lab/WindowsNotificationPoller.cs'
      - 'status-lab/WindowsNotificationModels.cs'
      - 'status-lab/NotificationRuleEngine.cs'
      - 'status-lab/NotificationOverlayScheduler.cs'
      - 'status-lab/NotificationLearningBuffer.cs'
      - 'status-lab/NotificationRulesConfig.cs'
      - 'status-lab/NotificationRuleDraftBuilder.cs'
      - 'status-lab/NotificationRulesStore.cs'
      - 'status-lab/notification-learning-lab/**'
      - 'status-lab/notifications/**'
      - 'status-lab/tests/NotificationRulesSmoke*'
      - 'status-lab/tests/NotificationRuleDesignerSmoke*'
      - 'status-lab/AssemblyInfo.cs'
      - '.github/workflows/status-lab-notifications-m1.yml'
  workflow_dispatch:

jobs:
  notification-engine:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Notification rule engine, learning and scheduler tests
        run: dotnet run --project status-lab/tests/NotificationRulesSmoke.csproj -c Release

      - name: Notification Rule Designer and atomic store tests
        run: dotnet run --project status-lab/tests/NotificationRuleDesignerSmoke.csproj -c Release

      - name: Build Status Lab with notification observation model
        run: dotnet build status-lab/Vorotex.K15.StatusLab.csproj -c Release

      - name: Build Notification Learning Lab
        run: dotnet build status-lab/notification-learning-lab/Vorotex.K15.NotificationLearningLab.csproj -c Release

      - name: Verify notification subsystem isolation
        shell: powershell
        run: |
          $paths = @(
            'status-lab/WindowsNotificationModels.cs',
            'status-lab/NotificationRuleEngine.cs',
            'status-lab/NotificationOverlayScheduler.cs',
            'status-lab/NotificationLearningBuffer.cs',
            'status-lab/NotificationRulesConfig.cs',
            'status-lab/NotificationRuleDraftBuilder.cs',
            'status-lab/NotificationRulesStore.cs'
          )
          $paths += Get-ChildItem -LiteralPath 'status-lab/notification-learning-lab' -Filter '*.cs' -File | ForEach-Object FullName
          $text = ($paths | ForEach-Object { Get-Content -LiteralPath $_ -Raw -Encoding UTF8 }) -join "`n"
          if ($text -match 'HidD_SetFeature|DeviceWriteCommand|LightingWriteCommand|SelectActiveSlot|ApplyEffect') {
            throw 'Notification Engine / Learning Lab must remain read-only with respect to K15.'
          }
          if ($text -match 'K15NormalizedState|StateReducer') {
            throw 'Notification Engine / Learning Lab must not mutate or depend on Codex semantic state.'
          }
          Write-Output 'Notification Engine isolation gates: PASS'

      - name: Verify bounded overlay scheduler
        shell: powershell
        run: |
          $scheduler = Get-Content -LiteralPath 'status-lab/NotificationOverlayScheduler.cs' -Raw -Encoding UTF8
          if ($scheduler -notmatch 'PendingCount' -or $scheduler -notmatch '_pending') {
            throw 'Notification overlay scheduler must expose the bounded single-pending model.'
          }
          if ($scheduler -match 'Queue<|ConcurrentQueue<|List<ScheduledNotificationOverlay>') {
            throw 'Notification overlay scheduler must not grow an unbounded queue.'
          }
          Write-Output 'Notification overlay bounded-queue gate: PASS'

      - name: Verify explicit atomic rule persistence
        shell: powershell
        run: |
          $store = Get-Content -LiteralPath 'status-lab/NotificationRulesStore.cs' -Raw -Encoding UTF8
          if ($store -notmatch 'File\.Replace' -or $store -notmatch 'BackupPathFor' -or $store -notmatch 'PreRestoreBackupPathFor') {
            throw 'Notification rules store must retain atomic replace + backup/restore semantics.'
          }
          if ($store -notmatch 'Duplicate notification rule ids|already exists') {
            throw 'Notification rules store must reject duplicate ids.'
          }
          Write-Output 'Notification rules atomic persistence gate: PASS'

      - name: Verify Learning Lab privacy boundary
        shell: powershell
        run: |
          $lab = (Get-ChildItem -LiteralPath 'status-lab/notification-learning-lab' -Filter '*.cs' -File |
            ForEach-Object { Get-Content -LiteralPath $_.FullName -Raw -Encoding UTF8 }) -join "`n"
          if ($lab -match 'File\.WriteAllText|File\.AppendAllText|StreamWriter|EventJournal\.Append') {
            throw 'Learning Lab UI must not directly persist raw learning samples.'
          }
          if ($lab -notmatch 'NotificationLearningBuffer' -or $lab -notmatch 'RAM only|RAM-only') {
            throw 'Learning Lab must keep its bounded in-memory learning boundary explicit.'
          }
          if ($lab -notmatch 'NotificationRuleDesignerForm' -or $lab -notmatch 'Save rule') {
            throw 'Learning Lab must expose the explicit Rule Designer save flow.'
          }
          Write-Output 'Notification Learning Lab privacy + explicit Rule Designer gate: PASS'

      - name: Publish Notification Learning Lab
        run: dotnet publish status-lab/notification-learning-lab/Vorotex.K15.NotificationLearningLab.csproj -c Release -r win-x64 --self-contained true -o publish-notification-learning-lab

      - name: Verify Learning Lab executable
        shell: powershell
        run: |
          $exe = 'publish-notification-learning-lab/Vorotex.K15.NotificationLearningLab.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "Missing $exe" }
          Write-Output 'Notification Learning Lab publish: PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: vorotex-k15-notification-learning-lab-win-x64
          path: publish-notification-learning-lab/
          if-no-files-found: error
