name: HUD build

on:
  pull_request:
    paths:
      - 'hud/**'
      - '.github/workflows/hud-build.yml'
  push:
    branches:
      - 'agent/**'
    paths:
      - 'hud/**'
      - '.github/workflows/hud-build.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore hud/Vorotex.K15.Hud.csproj

      - name: Build
        run: dotnet build hud/Vorotex.K15.Hud.csproj -c Release --no-restore

      - name: Publish win-x64
        run: dotnet publish hud/Vorotex.K15.Hud.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true --no-restore

      - name: Upload portable HUD
        uses: actions/upload-artifact@v4
        with:
          name: vorotex-k15-hud-win-x64
          path: hud/bin/Release/net8.0-windows/win-x64/publish/*
          if-no-files-found: error
