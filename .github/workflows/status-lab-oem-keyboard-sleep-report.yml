name: Status Lab OEM Keyboard Sleep Report Trace

on:
  pull_request:
    paths:
      - 'status-lab/hid-research-lab/OemKeyboardSleepReport*.cs'
      - 'status-lab/tests/oem-keyboard-sleep-report-smoke.ps1'
      - 'status-lab/tests/oem-keyboard-sleep-payload-helper-smoke.ps1'
      - '.github/workflows/status-lab-oem-keyboard-sleep-report.yml'
  push:
    branches:
      - 'agent/**'
    paths:
      - 'status-lab/hid-research-lab/OemKeyboardSleepReport*.cs'
      - 'status-lab/tests/oem-keyboard-sleep-report-smoke.ps1'
      - 'status-lab/tests/oem-keyboard-sleep-payload-helper-smoke.ps1'
      - '.github/workflows/status-lab-oem-keyboard-sleep-report.yml'

permissions:
  contents: read

jobs:
  keyboard-sleep-report-readonly:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: OEM Keyboard Sleep Report read-only safety smoke
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File status-lab/tests/oem-keyboard-sleep-report-smoke.ps1

      - name: OEM Keyboard Sleep Payload Helper read-only safety smoke
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File status-lab/tests/oem-keyboard-sleep-payload-helper-smoke.ps1

      - name: Restore HID Research Lab
        run: dotnet restore status-lab/hid-research-lab/Vorotex.K15.HidResearchLab.csproj

      - name: Build HID Research Lab
        run: dotnet build status-lab/hid-research-lab/Vorotex.K15.HidResearchLab.csproj -c Release --no-restore
