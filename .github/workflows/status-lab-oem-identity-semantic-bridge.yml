name: Status Lab OEM Identity Semantic Bridge Trace

on:
  push:
    branches:
      - 'agent/**'
    paths:
      - 'status-lab/hid-research-lab/**'
      - 'status-lab/tests/oem-identity-semantic-bridge-smoke.ps1'
      - '.github/workflows/status-lab-oem-identity-semantic-bridge.yml'
  pull_request:
    paths:
      - 'status-lab/hid-research-lab/**'
      - 'status-lab/tests/oem-identity-semantic-bridge-smoke.ps1'
      - '.github/workflows/status-lab-oem-identity-semantic-bridge.yml'

permissions:
  contents: read

jobs:
  identity-semantic-bridge-readonly:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: OEM Identity Semantic Bridge read-only safety smoke
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File status-lab/tests/oem-identity-semantic-bridge-smoke.ps1

      - name: Restore HID Research Lab
        run: dotnet restore status-lab/hid-research-lab/Vorotex.K15.HidResearchLab.csproj

      - name: Build HID Research Lab
        run: dotnet build status-lab/hid-research-lab/Vorotex.K15.HidResearchLab.csproj -c Release --no-restore
