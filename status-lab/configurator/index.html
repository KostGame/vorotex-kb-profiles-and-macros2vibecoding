<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VOROTEX K15 Status Lab Configurator</title><style>:root{color-scheme:dark;font-family:Segoe UI,Arial,sans-serif;background:#0f1115;color:#e8edf5}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:#171a21;border:1px solid #2a3040;border-radius:12px;padding:15px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{margin:8px 0}.field label{display:block;font-size:12px;color:#aeb8ca;margin-bottom:4px}input,select,button,textarea{width:100%;background:#101319;color:#eef3fb;border:1px solid #343c50;border-radius:8px;padding:8px}input[type=color]{height:40px;padding:3px}input[type=checkbox]{width:auto}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{width:auto}.muted{color:#95a0b3;font-size:13px}.note{color:#9fc5ff;font-size:12px}.ok{color:#79d99a}.bad{color:#ff8c8c}textarea{min-height:380px;font-family:Consolas,monospace;font-size:12px}@media(max-width:650px){.row{grid-template-columns:1fr}}</style></head><body><div class="wrap">
<h1>VOROTEX K15 Status Lab</h1><div class="muted">Локальный конфигуратор. Только эффекты с контролируемой палитрой 1–2 цвета.</div>
<div class="card"><div class="actions"><button id="loadBtn">Загрузить config.toml</button><button id="downloadBtn">Скачать config.toml</button><button id="defaultsBtn">Defaults</button><input id="fileInput" type="file" accept=".toml,text/plain" hidden></div><div id="validation" class="muted" style="margin-top:10px"></div></div>
<div class="card"><h2>Профили</h2><div class="grid"><div><h3>Profile A · RED</h3><input id="aColorPicker" type="color"><div class="field"><label>HEX</label><input id="aColor" maxlength="7"></div></div><div><h3>Profile B · BLUE</h3><input id="bColorPicker" type="color"><div class="field"><label>HEX</label><input id="bColor" maxlength="7"></div></div></div></div>
<div class="card"><h2>Состояния</h2><div id="states" class="grid"></div></div><div class="card"><h2>Overlays</h2><div class="grid"><div id="profileSwitch"></div><div id="activation"></div></div></div>
<div class="card"><h2>Device / Effect Lab</h2><div class="grid"><div class="field"><label>Wire color order</label><select id="wire"><option value="rgb">rgb</option><option value="grb">grb</option></select></div><div class="field"><label>Effect Lab duration, sec</label><input id="labDuration" type="number" min="0.5" max="30" step="0.5"></div></div></div>
<div class="card"><h2>Generated TOML</h2><textarea id="preview" spellcheck="false"></textarea></div></div>
<script>
const effects=[['constant','Constant'],['flowing_water','Flowing Water'],['mono_water','Mono Water'],['single_color_breathing','Single-color breathing'],['off','Off']],allowed=new Set(effects.map(x=>x[0]));
const defaults={schema_version:2,wire:'rgb',profiles:{A:'#FF0000',B:'#0000FF'},states:{running:{enabled:true,effect:'mono_water',brightness:4,speed:3,direction:0,duration_seconds:0},waiting:{enabled:true,effect:'single_color_breathing',brightness:6,speed:6,direction:0,duration_seconds:0},done:{enabled:true,effect:'single_color_breathing',brightness:6,speed:3,direction:0,duration_seconds:10},error:{enabled:true,effect:'single_color_breathing',brightness:6,speed:7,direction:0,duration_seconds:15}},profile_switch:{enabled:true,effect:'flowing_water',brightness:6,speed:5,direction:0,duration_seconds:2},activation:{enabled:false,effect:'mono_water',brightness:4,speed:4,direction:0,duration_seconds:2},lab:4};let model=structuredClone(defaults);
const getObj=p=>p.startsWith('states.')?model.states[p.split('.')[1]]:model[p];
function card(key,title,target){target.innerHTML=`<h3>${title}</h3><div class="field"><label><input data-k="enabled" type="checkbox"> enabled</label></div><div class="field"><label>Effect</label><select data-k="effect">${effects.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}</select></div><div class="note">Rainbow/multicolor modes недоступны.</div><div class="row"><div class="field"><label>Brightness 1..6</label><input data-k="brightness" type="number" min="1" max="6"></div><div class="field"><label>Speed 1..7</label><input data-k="speed" type="number" min="1" max="7"></div></div><div class="row"><div class="field"><label>Direction</label><select data-k="direction"><option value="0">0</option><option value="1">1</option></select></div><div class="field"><label>Duration sec</label><input data-k="duration_seconds" type="number" min="0" max="3600" step="0.5"></div></div>`;target.dataset.key=key;target.querySelectorAll('input,select').forEach(el=>el.oninput=()=>{readCard(target);render()})}
function build(){const s=document.querySelector('#states');for(const [k,t] of Object.entries({running:'RUNNING',waiting:'WAITING',done:'DONE',error:'ERROR'})){const d=document.createElement('div');d.className='card';s.append(d);card('states.'+k,t,d)}card('profile_switch','Profile switch',document.querySelector('#profileSwitch'));card('activation','Activation',document.querySelector('#activation'));for(const id of ['aColor','bColor','aColorPicker','bColorPicker','wire','labDuration'])document.querySelector('#'+id).oninput=()=>{readBasic(id);render()};document.querySelector('#loadBtn').onclick=()=>document.querySelector('#fileInput').click();document.querySelector('#fileInput').onchange=loadFile;document.querySelector('#downloadBtn').onclick=download;document.querySelector('#defaultsBtn').onclick=()=>{model=structuredClone(defaults);apply()};apply()}
function setPair(p){const l=p.toLowerCase();document.querySelector('#'+l+'Color').value=model.profiles[p];document.querySelector('#'+l+'ColorPicker').value=model.profiles[p].toLowerCase()}function readBasic(id){if(id==='aColor'||id==='aColorPicker'){model.profiles.A=document.querySelector('#'+id).value.toUpperCase();setPair('A')}if(id==='bColor'||id==='bColorPicker'){model.profiles.B=document.querySelector('#'+id).value.toUpperCase();setPair('B')}if(id==='wire')model.wire=document.querySelector('#wire').value;if(id==='labDuration')model.lab=Number(document.querySelector('#labDuration').value)}function readCard(c){const o=getObj(c.dataset.key);for(const el of c.querySelectorAll('[data-k]')){const k=el.dataset.k;o[k]=el.type==='checkbox'?el.checked:(['brightness','speed','direction','duration_seconds'].includes(k)?Number(el.value):el.value)}}function apply(){setPair('A');setPair('B');document.querySelector('#wire').value=model.wire;document.querySelector('#labDuration').value=model.lab;for(const c of document.querySelectorAll('[data-key]')){const o=getObj(c.dataset.key);for(const el of c.querySelectorAll('[data-k]')){const k=el.dataset.k;if(el.type==='checkbox')el.checked=!!o[k];else el.value=o[k]}}render()}
function validate(){const e=[];for(const [p,c] of Object.entries(model.profiles))if(!/^#[0-9A-Fa-f]{6}$/.test(c))e.push(`Profile ${p}: color должен быть #RRGGBB`);for(const [path,o] of [...Object.entries(model.states).map(x=>['states.'+x[0],x[1]]),['profile_switch',model.profile_switch],['activation',model.activation]]){if(!allowed.has(o.effect))e.push(`${path}.effect запрещён: палитра не контролируется`);if(o.brightness<1||o.brightness>6)e.push(`${path}.brightness 1..6`);if(o.speed<1||o.speed>7)e.push(`${path}.speed 1..7`);if(o.direction<0||o.direction>1)e.push(`${path}.direction 0..1`);if(o.duration_seconds<0||o.duration_seconds>3600)e.push(`${path}.duration_seconds 0..3600`)}if(model.lab<.5||model.lab>30)e.push('effect_lab.test_duration_seconds 0.5..30');return e}
const effectToml=(s,o,h)=>`[${s}]\n# ${h}\nenabled = ${o.enabled}\neffect = "${o.effect}"\nbrightness = ${o.brightness}\nspeed = ${o.speed}\ndirection = ${o.direction}\nduration_seconds = ${o.duration_seconds}\n\n`;
function toml(){let s=`# VOROTEX K15 Status Lab\n# Только controlled 1-2 color effects. Default renderer uses one profile color.\n# Allowed: constant, flowing_water, mono_water, single_color_breathing, off.\n\nschema_version = 2\n\n[device]\nwire_color_order = "${model.wire}"\n\n[profiles.A]\ncolor = "${model.profiles.A}"\n\n[profiles.B]\ncolor = "${model.profiles.B}"\n\n`;for(const [k,h] of Object.entries({running:'RUNNING',waiting:'WAITING',done:'DONE',error:'ERROR'}))s+=effectToml('states.'+k,model.states[k],h+' в цвете активного профиля.');s+=effectToml('profile_switch',model.profile_switch,'Одноцветный overlay нового профиля.');s+=effectToml('activation',model.activation,'Default off.');return s+`[effect_lab]\ntest_duration_seconds = ${model.lab}\n`}
function stripComment(line){let q=false,esc=false;for(let i=0;i<line.length;i++){const c=line[i];if(esc){esc=false;continue}if(c==='\\'&&q){esc=true;continue}if(c==='"'){q=!q;continue}if(c==='#'&&!q)return line.slice(0,i)}return line}function parseString(v){const m=v.match(/^"((?:\\.|[^"])*)"$/);if(!m)throw new Error('Ожидалась строка в двойных кавычках');return m[1].replace(/\\"/g,'"').replace(/\\\\/g,'\\')}
function parseToml(text){const m=structuredClone(defaults);let sec='';for(const [n,line0] of text.split(/\r?\n/).entries()){const raw=stripComment(line0).trim();if(!raw)continue;if(raw.startsWith('[')&&raw.endsWith(']')){sec=raw.slice(1,-1).trim();continue}const i=raw.indexOf('=');if(i<1)throw new Error(`Строка ${n+1}: ожидалось key = value`);const k=raw.slice(0,i).trim(),v=raw.slice(i+1).trim(),str=v.startsWith('"')?parseString(v):null,num=Number(v),bool=v==='true'?true:v==='false'?false:null;if(!sec&&k==='schema_version')m.schema_version=num;else if(sec==='device'&&k==='wire_color_order')m.wire=str;else if(sec==='profiles.A'&&k==='color')m.profiles.A=str.toUpperCase();else if(sec==='profiles.B'&&k==='color')m.profiles.B=str.toUpperCase();else if(sec==='effect_lab'&&k==='test_duration_seconds')m.lab=num;else{const o=sec.startsWith('states.')?m.states[sec.split('.')[1]]:m[sec];if(o){if(k==='enabled')o.enabled=bool;else if(k==='effect')o.effect=str;else if(['brightness','speed','direction','duration_seconds'].includes(k))o[k]=num}}}return m}
function render(){document.querySelector('#preview').value=toml();const e=validate(),v=document.querySelector('#validation');v.className=e.length?'bad':'ok';v.textContent=e.length?'Ошибки: '+e.join(' · '):'Config валиден: только контролируемые одно-/двухцветные режимы.'}async function loadFile(ev){const f=ev.target.files[0];if(!f)return;try{model=parseToml(await f.text());apply()}catch(err){alert('Не удалось разобрать TOML: '+err.message)}finally{ev.target.value=''}}function download(){const e=validate();if(e.length){alert('Сначала исправь ошибки.');return}const b=new Blob([toml()],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='config.toml';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}build();
</script></body></html>
