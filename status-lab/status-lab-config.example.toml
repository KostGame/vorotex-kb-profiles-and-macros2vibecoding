# VOROTEX K15 Status Lab
#
# Цвет задаёт аппаратный профиль. NORMAL восстанавливает exact baseline.
# В notifier разрешены только режимы с явно управляемым цветом/палитрой:
# constant, flowing_water, single_color_breathing, off.
#
# Native mode 0x83 в OEM UI называется Horse race. Старое имя Status Lab: mono_water.
# Он, cycle_breathing, tetris_blocks, neon и ambilight исследуются только через K15 Lighting Lab.
# Status Lab НИКОГДА программно не переключает hardware Profile A/B.

schema_version = 2

[device]
wire_color_order = "rgb"

[profiles.A]
# RED / TOOLS-AUTH
color = "#FF0000"

[profiles.B]
# BLUE / MAIN-VIBECODING
color = "#0000FF"

[states.running]
enabled = true
effect = "single_color_breathing"
brightness = 4
speed = 3
direction = 0
duration_seconds = 0

[states.waiting]
enabled = true
effect = "single_color_breathing"
brightness = 6
speed = 6
direction = 0
duration_seconds = 0

[states.done]
enabled = true
effect = "single_color_breathing"
brightness = 6
speed = 3
direction = 0
duration_seconds = 10

[states.error]
enabled = true
effect = "single_color_breathing"
brightness = 6
speed = 7
direction = 0
duration_seconds = 15

[profile_switch]
# Применяется напрямую к уже физически выбранному новому профилю.
enabled = true
effect = "single_color_breathing"
brightness = 6
speed = 5
direction = 0
duration_seconds = 2

[activation]
enabled = false
effect = "single_color_breathing"
brightness = 4
speed = 4
direction = 0
duration_seconds = 2

[effect_lab]
test_duration_seconds = 4
