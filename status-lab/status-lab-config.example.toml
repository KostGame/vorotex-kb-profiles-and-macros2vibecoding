# VOROTEX K15 Status Lab
#
# Цвета принадлежат аппаратным профилям A/B. NORMAL восстанавливает exact baseline.
# palette = "profile"      -> цвет физически активного профиля
# palette = "profile_pair" -> два основных цвета: A затем B
#
# Production notifier modes:
# constant, flowing_water, single_color_breathing, cycle_breathing, off.
# Horse race / native 0x83, Tetris, Neon и Ambilight остаются в K15 Lighting Lab.
# Status Lab НИКОГДА программно не переключает hardware Profile A/B.

schema_version = 3

[device]
wire_color_order = "rgb"

[profiles.A]
# RED / TOOLS-AUTH
color = "#FF0000"

[profiles.B]
# BLUE / MAIN-VIBECODING
color = "#0000FF"

[states.running]
# Работа Codex: спокойный Flowing Water в цвете активного профиля.
enabled = true
effect = "flowing_water"
palette = "profile"
brightness = 4
speed = 3
direction = 0
duration_seconds = 0

[states.waiting]
# Запрос/ожидание: быстрое мигание, сразу заметно.
enabled = true
effect = "single_color_breathing"
palette = "profile"
brightness = 6
speed = 7
direction = 0
duration_seconds = 0

[states.done]
# После STOP-сигнала: медленное напоминание до acknowledge/notification resolve.
enabled = true
effect = "single_color_breathing"
palette = "profile"
brightness = 6
speed = 5
direction = 0
duration_seconds = 0

[states.error]
# Зарезервировано до появления high-confidence semantic ERROR source.
enabled = false
effect = "single_color_breathing"
palette = "profile"
brightness = 6
speed = 7
direction = 0
duration_seconds = 0

[profile_switch]
# Короткий эффект только в цвете уже физически выбранного НОВОГО профиля.
enabled = true
effect = "flowing_water"
palette = "profile"
brightness = 5
speed = 5
direction = 0
duration_seconds = 2

[stop_signal]
# Момент Stop: RED <-> BLUE, затем states.done.
enabled = true
effect = "cycle_breathing"
palette = "profile_pair"
brightness = 6
speed = 7
direction = 0
duration_seconds = 3

[activation]
# Включение RGB tracking: Flowing Water двумя основными цветами A/B.
enabled = true
effect = "flowing_water"
palette = "profile_pair"
brightness = 5
speed = 5
direction = 0
duration_seconds = 3

[effect_lab]
test_duration_seconds = 4
