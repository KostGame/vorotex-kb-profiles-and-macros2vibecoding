# VOROTEX K15 Status Lab
#
# Цвет задаёт аппаратный профиль. Состояния меняют только эффект.
# NORMAL всегда восстанавливает точный baseline, считанный с клавиатуры.
#
# Allowed notifier effects:
#   constant
#   flowing_water
#   mono_water
#   single_color_breathing
#   off
#
# Только эффекты с контролируемой палитрой 1-2 цвета разрешены.
# cycle_breathing, tetris_blocks, neon и ambilight не допускаются notifier-валидатором.
# Low-level HID mapping для них остаётся только для research/forensics.

schema_version = 2

[device]
# rgb доказан на текущей физической K15; grb оставлен для совместимости.
wire_color_order = "rgb"

[profiles.A]
# RED / TOOLS-AUTH
color = "#FF0000"

[profiles.B]
# BLUE / MAIN-VIBECODING
color = "#0000FF"

[states.running]
# RUNNING: спокойное движение в цвете активного профиля.
enabled = true
effect = "mono_water"
brightness = 4
speed = 3
direction = 0
duration_seconds = 0

[states.waiting]
# WAITING: заметное ожидание в том же цвете.
enabled = true
effect = "single_color_breathing"
brightness = 6
speed = 6
direction = 0
duration_seconds = 0

[states.done]
# DONE: ограниченный attention-effect; затем exact baseline.
enabled = true
effect = "single_color_breathing"
brightness = 6
speed = 3
direction = 0
duration_seconds = 10

[states.error]
# ERROR: только high-confidence semantic error.
enabled = true
effect = "single_color_breathing"
brightness = 6
speed = 7
direction = 0
duration_seconds = 15

[profile_switch]
# Короткий ОДНОЦВЕТНЫЙ overlay в цвете НОВОГО профиля, затем resume state.
enabled = true
effect = "flowing_water"
brightness = 6
speed = 5
direction = 0
duration_seconds = 2

[activation]
# Выключено по умолчанию: никакой красно-синей дискотеки при старте notifier.
enabled = false
effect = "mono_water"
brightness = 4
speed = 4
direction = 0
duration_seconds = 2

[effect_lab]
# Время одного теста перед автоматическим exact restore.
test_duration_seconds = 4
